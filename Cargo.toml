[package]
name = "segotep-be-aced"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.31", features = ["default"] }
hidapi = { version = "2.6.7", features = ["windows-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-zip", "compression-zip-deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.21"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1.12"
